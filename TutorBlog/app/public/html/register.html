<!DOCTYPE html>
<html>
<head>
<title>Register</title>
</head>
<body>
<h2>Create Account</h2>
<form action="/register" method="POST">

<input
type="email"
name="email"
placeholder="Email"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit">
Register
</button>

</form>
<p>Already have an account? <a href="/">Login</a></p>
</body>
</html>
